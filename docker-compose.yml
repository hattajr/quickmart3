x-prod-env: &prod-env
  env_file:
    - .env.prod

services:
  restore:
    <<: *prod-env
    image: litestream/litestream:latest
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ./data:/data
      - ./litestream.yml:/etc/litestream.yml
    command: restore -if-replica-exists -if-db-not-exists /data/quickmart.sqlite3

  app:
    <<: *prod-env
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8756:8756"
    volumes:
      - ./data:/data
    environment:
      SQLITE_PATH: /data/quickmart.sqlite3
      SQLITE_DIR: /data
      RELOAD: "0"
    depends_on:
      restore:
        condition: service_completed_successfully

  litestream:
    <<: *prod-env
    image: litestream/litestream:latest
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 1m
    volumes:
      - ./data:/data
      - ./litestream.yml:/etc/litestream.yml
    command: replicate
    depends_on:
      restore:
        condition: service_completed_successfully

  grafana:
    build:
      context: ./grafana
    user: "0:0"
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - ./data:/data
    depends_on:
      restore:
        condition: service_completed_successfully

  sqlite-web:
    image: coleifer/sqlite-web:latest
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:7756:8080"
    volumes:
      - ./data:/data
    command: sqlite_web -H 0.0.0.0 -x /data/quickmart.sqlite3
    depends_on:
      restore:
        condition: service_completed_successfully

volumes:
  grafana-data:
