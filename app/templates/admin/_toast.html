<div class="bg-{% if type == 'error' %}red{% else %}green{% endif %}-100 border-2 border-gray-900 rounded-md shadow-[4px_4px_0px] shadow-gray-900 p-4 min-w-72 max-w-md"
    x-data="{ init() { setTimeout(() => this.$el.remove(), 5000) } }">
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-start gap-2">
            <span class="material-symbols-outlined text-{% if type == 'error' %}red{% else %}green{% endif %}-600">
                {% if type == 'error' %}error{% else %}check_circle{% endif %}
            </span>
            <p class="text-sm font-medium text-gray-900">{{ message }}</p>
        </div>
        <button @click="$el.closest('.bg-red-100, .bg-green-100').remove()" class="text-gray-500 hover:text-gray-700">
            <span class="material-symbols-outlined text-xl">close</span>
        </button>
    </div>
</div>
