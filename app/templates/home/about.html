<dialog id="about"
    class="fixed inset-0 m-auto w-full max-w-md p-6 bg-[#fff4da] border-3 rounded-xl border-gray-900 shadow-[10px_10px_0px] shadow-gray-900 backdrop:backdrop-blur-sm backdrop:bg-black/30">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-900">Payment & Contact</h2>
        <button autofocus _="on click call #about's close()" class="hover:opacity-80 transition-opacity">
            <span class="material-symbols-outlined text-2xl text-gray-700">close</span>
        </button>
    </div>

    <div class="space-y-6">
        <!-- Bank Information Section -->
        <div class="bg-white border-2 border-gray-900 rounded-lg p-4 shadow-[4px_4px_0px] shadow-gray-900">
            <h3 class="text-lg font-bold text-gray-900 mb-3 flex items-center gap-2">
                <span class="material-symbols-outlined">account_balance</span>
                Bank Information
            </h3>
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <span class="text-sm font-medium text-gray-600">Bank</span>
                    <span class="font-semibold text-gray-900">Hana Bank</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-sm font-medium text-gray-600">Account Name</span>
                    <span class="font-semibold text-gray-900">Apriliyanto Fada</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-sm font-medium text-gray-600">Account Number</span>
                    <span class="font-mono font-bold text-gray-900 tracking-wide">3989 1053 191007</span>
                </div>
            </div>
        </div>

        <!-- Contact Information Section -->
        <div class="bg-white border-2 border-gray-900 rounded-lg p-4 shadow-[4px_4px_0px] shadow-gray-900">
            <h3 class="text-lg font-bold text-gray-900 mb-3 flex items-center gap-2">
                <span class="material-symbols-outlined">contact_phone</span>
                Contact Us
            </h3>
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <span class="text-sm font-medium text-gray-600">Confirmation</span>
                    <a href="tel:01056082996" class="font-semibold text-blue-600 hover:underline">010 5608 2996</a>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-sm font-medium text-gray-600">Feedback (Hatta)</span>
                    <a href="tel:01038546810" class="font-semibold text-blue-600 hover:underline">010 3854 6810</a>
                </div>
            </div>
        </div>
    </div>
</dialog>
