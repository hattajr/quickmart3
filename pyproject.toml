[project]
name = "quickmart3"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.35.91",
    "fastapi>=0.121.3",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "pydantic>=2.12.4",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.0.0",
    "ua-parser>=1.0.1",
    "user-agents>=2.2.0",
    "uvicorn>=0.38.0",
]

[tool.uv.sources]
db = { path = "./app/db" }

[tool.ruff]
exclude = ["tests", "test_*.py", "*_test.py", "migrations"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pyright]
exclude = ["tests", "migrations", ".venv", ".trash"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

