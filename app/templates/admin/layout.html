<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#FFFDF8">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
    <link rel="manifest" href="/static/favicon/site.webmanifest?v=3">
    <title>{% block title %}Admin{% endblock %} · IKMI Mart</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="/static/css/admin.css?v=3">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.js"
        integrity="sha384-ezjq8118wdwdRMj+nX4bevEi+cDLTbhLAeFF688VK8tPDGeLUe0WoY2MZtSla72F"
        crossorigin="anonymous"></script>
    <script defer src="/static/js/admin.js?v=1"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>

<body>
    <div class="app">
        <header class="a-head">
            <a class="logo" href="/">IKMI <b>Mart</b><small>Admin</small></a>
            {% block header_action %}
            <form method="post" action="/admin/logout">
                <button class="icon-btn" aria-label="Log out" title="Log out"><span class="icon">logout</span></button>
            </form>
            {% endblock %}
        </header>
        <main class="scroll" id="main">
            {% block content %}{% endblock %}
        </main>
        {% block nav %}
        <nav class="botbar" aria-label="Admin sections">
            <a class="bottab" href="/admin/products" {% if tab == 'products' %}aria-current="page"{% endif %}>
                <span class="icon">inventory_2</span>Products
            </a>
            <a class="bottab" href="/admin/invoices" {% if tab == 'invoices' %}aria-current="page"{% endif %}>
                <span class="icon">receipt_long</span>Invoices
            </a>
            <a class="bottab" href="/admin/popular" {% if tab == 'popular' %}aria-current="page"{% endif %}>
                <span class="icon">trending_up</span>Popular
            </a>
            <a class="bottab" href="/admin/messages" {% if tab == 'messages' %}aria-current="page"{% endif %}>
                <span class="icon">chat</span>Messages
                {% if tab != 'messages' %}<span hx-get="/admin/messages/new-count" hx-trigger="load" hx-swap="outerHTML"></span>{% endif %}
            </a>
        </nav>
        {% endblock %}
    </div>
    <div id="sheet"></div>
    <div id="toast" aria-live="polite"></div>
</body>

</html>
