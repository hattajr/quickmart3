{% extends "shared/_layout.html" %}
{% block main_content %}



<div class="relative max-w-4xl mx-auto  p-4">
  <div class="relative bg-[#fff4da] border-3 rounded-xl border-gray-900 shadow-[10px_10px_0px] shadow-gray-900 p-2 z-10">
    <div class="flex gap-2.5 mb-2.5">
      <div class="flex-1 relative">
        <div class="border-2 rounded-md border-gray-900 shadow-[4px_4px_0px] shadow-gray-900 border-gray-300 bg-sky-50">
          <input id="search-input" class="p-2 w-full border-none text-sm" autocomplete="off" autocorrect="off" autocapitalize="off"
            spellcheck="false" hx-indicator="#loading" type="search" hx-get="/search"
            hx-target="#search-result-container" hx-swap="innerHTML" hx-trigger="keyup[key=='Enter' && this.value.length >= 1], keyup[this.value.length >= 1]"
             name="q"
            placeholder="Search..." clearable _="
    on input
      if my value.trim() != '' 
        remove .hidden from #search-result-container
      else 
        add .hidden to #search-result-container
      end

    on click from document
      if event.target is not in me and event.target is not in #search-result-container
        add .hidden to #search-result-container
        set me.value to ''
        focus() to me
      end
    end

  "/>
        </div>

        <div id="search-result-container"
          class="hidden mt-2 p-1.5 flex flex-col gap-2 absolute border-2 rounded-md border-gray-900 shadow-[4px_4px_0px] shadow-gray-900 max-h-70 w-full overflow-y-auto z-20 bg-sky-50"
          >
          <div id="loading">loading...</div>
        </div>
      </div>


      <div id="search-camera"
        class="w-10 flex flex-row gap-2 border-2 rounded-md border-gray-900 shadow-[4px_4px_0px] shadow-gray-900 flex items-center justify-center cursor-pointer">
      </div>

    </div>

    <div class="flex flex-wrap gap-1 max-w-sm">
      <div class="flex items-center bg-[#EBDBB7] gap-1 py-1 px-2.5 border rounded-sm border-gray-900 text-sm">
        <span>Apple</span>
      </div>
      <div class="flex items-center gap-1 bg-[#EBDBB7] py-1 px-2.5 border rounded-sm border-gray-900 text-sm">
        <span class="truncate max-w-[6rem]">Banananananannanananana</span>
      </div>
    </div>
  </div>


  <div id="cart-container" 
  class="flex flex-col gap-2 bg-[#fff4da] border-3 rounded-xl border-gray-900 shadow-[10px_10px_0px] shadow-gray-900 mt-4 h-100 md:h-180  p-2 overflow-y-auto"
  >
  </div>


    <div id="checkout-container" class="border-3 rounded-xl border-gray-900 shadow-[10px_10px_0px] shadow-gray-900 mt-4 bg-[#fff4da] p-3 w-full">
        <div class="flex justify-between items-center gap-6">
            <div id="total" hx-swap-oob="true" class="flex flex-col gap-1">
                <p class="text-sm font-normal text-gray-500 tracking-wide">Total Items: 0</p>
                <p class="text-3xl font-bold text-gray-900 tracking-tight">₩0</p>
            </div>
            <button 
                id="checkout-button" 
                hx-post="/finish" 
                hx-target="#cart-container" 
                hx-swap="innerHTML"
                class="h-full aspect-square min-h-[80px] bg-green-500 font-semibold text-2xl flex flex-row gap-2 border-2 rounded-md border-gray-900 shadow-[4px_4px_0px] shadow-gray-900 flex items-center justify-center cursor-pointer">
                Finish
            </button>
        </div>
    </div>
</div>
{% endblock %}
