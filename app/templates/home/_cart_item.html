<div id="cart-item-{{row.id}}"
  class="border-2 rounded-md border-gray-900 shadow-[4px_4px_0px] h-24 flex overflow-hidden bg-white overflow-hidden flex-shrink-0"
  _ ="
    on load
      if #fav-{{row.id}} is in document
        add .pointer-events-none to #fav-{{row.id}}
        add .opacity-50 to #fav-{{row.id}}
        add .cursor-not-allowed to #fav-{{row.id}}
      end
  "
  >
  <div class="w-20 flex-shrink-0 bg-gray-200">
    <img src={{row.image_url
      or "https://upload.wikimedia.org/wikipedia/commons/1/14/No_Image_Available.jpg?20200913095930" }} alt="apple"
      class="w-full h-full object-cover">
  </div>
  <div class="flex-1 flex flex-col justify-between p-3 min-w-0">
    <div class="flex items-start justify-between gap-2">
      <div class="flex-1 min-w-0">
        <div class="text-sm font-bold truncate">
          {{row.name}}
        </div>
        <div class="text-xs text-gray-600 mt-0.5">{{price}}/pcs</div>
      </div>
      <button class="text-gray-500 hover:text-red-600 flex-shrink-0" hx-delete="/remove/{{row.id}}"
        hx-target="#cart-item-{{row.id}}" hx-swap="outerHTML"
        >
        <span class="material-symbols-outlined text-xl">close</span>
      </button>
    </div>
    {% include 'home/_cart_subtotal.html' %}

  </div>
</div>

{% include 'home/_total.html' %}
