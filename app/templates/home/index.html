{% extends "shared/base.html" %}

{% block main_content %}
<!-- Toast Container -->
<div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2" x-data>
  <template x-for="toast in $store.toasts.items" :key="toast.id">
    <div class="bg-white border-2 border-gray-900 rounded-md shadow-[4px_4px_0px] shadow-gray-900 p-4 min-w-72 max-w-md"
      :class="toast.type === 'error' ? 'bg-red-100' : 'bg-green-100'">
      <div class="flex items-start justify-between gap-3">
        <div class="flex items-start gap-2">
          <span class="material-symbols-outlined" :class="toast.type === 'error' ? 'text-red-600' : 'text-green-600'"
            x-text="toast.type === 'error' ? 'error' : 'check_circle'"></span>
          <p class="text-sm font-medium text-gray-900" x-text="toast.message"></p>
        </div>
        <button @click="$store.toasts.items = $store.toasts.items.filter(t => t.id !== toast.id)"
          class="text-gray-500 hover:text-gray-700">
          <span class="material-symbols-outlined text-xl">close</span>
        </button>
      </div>
    </div>
  </template>
</div>

<div class="relative max-w-4xl mx-auto mt-4 p-4">
  <div
    class="relative bg-[#fff4da] border-3 rounded-xl border-gray-900 shadow-[10px_10px_0px] shadow-gray-900 p-2 z-100">
    <div class="flex gap-2.5 mb-2.5">
      <div class="flex-1 relative" x-data="{ isSearching: false }">
        <div class="border-2 rounded-md border-gray-900 shadow-[4px_4px_0px] shadow-gray-900 bg-sky-50">
          <input id="search-input" type="search" name="q" placeholder="Search..." autocomplete="off" autocorrect="off"
            autocapitalize="off" spellcheck="false" class="p-2 w-full border-none text-sm" x-model="$store.search.query"
            hx-get="/search" hx-target="#search-results" hx-swap="innerHTML swap:0s"
            hx-trigger="keyup[this.value.length >= 3] changed delay:200ms, keyup[key=='Enter' && this.value.length >= 3]"
            hx-include="[name='exclude_ids']" @input="$store.search.isOpen = $store.search.query.trim().length >= 3"
            @htmx:before-request="$store.search.isOpen = true; isSearching = true"
            @htmx:after-request="isSearching = false"
            @click.outside="if (!$event.target.closest('#search-result-container')) $store.search.close()" />
          <input type="hidden" name="exclude_ids" :value="$store.cart.itemIds()" />
        </div>

        <div id="search-result-container" x-show="$store.search.isOpen" x-cloak @click.away="$store.search.close()"
          class="mt-2 absolute border-2 rounded-md border-gray-900 shadow-[4px_4px_0px] shadow-gray-900 max-h-70 w-full overflow-y-auto z-20 bg-sky-50">
          <div x-show="isSearching" class="flex items-center justify-center gap-2 p-4">
            <span class="material-symbols-outlined animate-spin text-gray-600">progress_activity</span>
            <span class="text-sm text-gray-600">Searching...</span>
          </div>
          <div id="search-results"></div>
        </div>
      </div>
    </div>

    <div class="flex flex-wrap gap-1 overflow-x-auto h-15" hx-get="/favorites" hx-trigger="load" hx-target="this"
      hx-swap="innerHTML">
    </div>
  </div>


  <div id="cart-container"
    class="flex flex-col gap-2 bg-[#fff4da] border-3 rounded-xl border-gray-900 shadow-[10px_10px_0px] shadow-gray-900 mt-4 md:mt-6 h-100 md:h-180 p-2 overflow-y-auto"
    x-data x-cloak>
    <template x-for="item in Object.values($store.cart.items)" :key="item.id">
      <div :id="'cart-item-' + item.id"
        class="border-2 rounded-md border-gray-900 shadow-[4px_4px_0px] h-24 flex overflow-hidden bg-white overflow-hidden flex-shrink-0">
        <div class="w-20 flex-shrink-0 bg-gray-200">
          <img
            :src="item.image_url || 'https://upload.wikimedia.org/wikipedia/commons/1/14/No_Image_Available.jpg?20200913095930'"
            alt="" class="w-full h-full object-cover"
            onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/1/14/No_Image_Available.jpg?20200913095930'">
        </div>
        <div class="flex-1 flex flex-col justify-between p-3 min-w-0">
          <div class="flex items-start justify-between gap-2">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-bold truncate" x-text="item.name"></div>
              <div class="text-xs text-gray-600 mt-0.5" x-text="'₩' + Math.floor(item.price).toLocaleString() + '/pcs'">
              </div>
            </div>
            <button class="text-gray-500 hover:text-red-600 flex-shrink-0" @click="$store.cart.removeItem(item.id)">
              <span class="material-symbols-outlined text-lg">close</span>
            </button>
          </div>
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5">
              <button @click="$store.cart.decreaseQty(item.id)"
                class="w-6 h-6 flex items-center justify-center border border-gray-900 rounded hover:bg-gray-100">
                <span class="material-symbols-outlined text-base">remove</span>
              </button>
              <span class="text-sm w-6 text-center font-medium" x-text="item.qty"></span>
              <button @click="$store.cart.increaseQty(item.id)"
                class="w-6 h-6 flex items-center justify-center border border-gray-900 rounded hover:bg-gray-100">
                <span class="material-symbols-outlined text-base">add</span>
              </button>
            </div>
            <div class="text-base font-bold"
              x-text="'₩' + Math.floor($store.cart.getSubtotal(item.id)).toLocaleString()"></div>
          </div>
        </div>
      </div>
    </template>
  </div>

  <div id="checkout-container"
    class="sticky bottom-0 z-50 border-3 rounded-xl border-gray-900 shadow-[10px_10px_0px] shadow-gray-900 mt-4 md:mt-6  bg-white/30 backdrop-blur-md p-3 w-full"
    x-data>
    <div class="flex justify-between items-center gap-3">
      <div class="flex flex-col gap-1">
        <p class="text-sm font-normal text-gray-500 tracking-wide" x-text="'Total Items: ' + $store.cart.totalQty()">
        </p>
        <p class="text-3xl font-bold text-gray-900 tracking-tight"
          x-text="'₩' + Math.floor($store.cart.totalPrice()).toLocaleString()"></p>
      </div>
      <div class="flex gap-2">
        <button id="restart-button"
          class="h-full aspect-square min-h-[80px] bg-blue-500 font-semibold text-2xl flex flex-row gap-2 border-2 rounded-md border-gray-900 shadow-[4px_4px_0px] shadow-gray-900 flex items-center justify-center cursor-pointer active:scale-95"
          @click="$store.cart.clear(); location.reload()">
          <span class="material-symbols-outlined" style="font-size: 36px;">refresh</span>
        </button>
        <button id="checkout-button"
          class="h-full aspect-square min-h-[80px] bg-green-500 font-semibold text-2xl flex flex-row gap-2 border-2 rounded-md border-gray-900 shadow-[4px_4px_0px] shadow-gray-900 flex items-center justify-center cursor-pointer active:scale-95"
          @click="
            if (Object.keys($store.cart.items).length === 0) {
              $store.toasts.show('Cart is empty', 'error');
              return;
            }
            fetch('/finish', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ items: $store.cart.items })
            })
            .then(res => {
              if (res.ok) {
                $el.closest('#main-content').querySelector('#thankyou-modal').showModal();
                setTimeout(() => {
                  $el.closest('#main-content').querySelector('#thankyou-modal').close();
                  $store.cart.clear();
                  location.href = '/';
                }, 5000);
              } else {
                $store.toasts.show('Checkout failed', 'error');
              }
            })
            .catch(err => $store.toasts.show('Network error', 'error'))
          ">
          Finish
        </button>
      </div>
    </div>
  </div>

  <!-- Thank You Modal -->
  <dialog id="thankyou-modal" x-data
    class="fixed inset-0 m-auto w-96 p-6 bg-[#fff4da] border-3 rounded-xl border-gray-900 shadow-[10px_10px_0px] shadow-gray-900 backdrop:backdrop-blur-sm backdrop:bg-black/30">
    <div class="flex flex-col items-center justify-center gap-4">
      <span class="material-symbols-outlined text-green-500" style="font-size: 64px;">check_circle</span>
      <h2 class="text-3xl font-bold text-gray-900">Thank You!</h2>
      <p class="text-lg text-gray-700 text-center">Your order has been completed successfully.</p>

      <!-- Order Summary -->
      <div class="w-full mt-2 p-4 bg-white border-2 border-gray-900 rounded-lg">
        <div class="flex justify-between items-center mb-2">
          <span class="text-gray-700 font-medium">Total Items:</span>
          <span class="text-gray-900 font-bold" x-text="$store.cart.totalQty()"></span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-gray-700 font-medium">Total Price:</span>
          <span class="text-gray-900 font-bold"
            x-text="'Rp ' + $store.cart.totalPrice().toLocaleString('id-ID')"></span>
        </div>
      </div>

      <button @click="$store.cart.clear(); $el.closest('dialog').close(); window.location.href='/'"
        class="mt-2 w-full bg-yellow-300 text-gray-900 text-lg font-semibold py-3 px-6 border-3 rounded-md border-gray-900 shadow-[8px_8px_0px] shadow-gray-900 cursor-pointer active:scale-95 hover:bg-yellow-400 transition-colors">
        Start shopping
      </button>
    </div>
  </dialog>
</div>
{% endblock %}
