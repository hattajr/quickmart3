{% extends 'shared/base.html' %}

{% block main_content %}
<div class="max-w-4xl mx-auto mt-4 p-4 grid grid-cols-2 md:grid-cols-3 gap-4">
    {% for item in items %}
    <div
        class="flex flex-col items-center bg-[#fff4da] border-3 rounded-xl border-gray-900 shadow-[10px_10px_0px] shadow-gray-900 p-2 h-50">
        <img src="{{item.image_url or assets_url ~ item.barcode ~ '.png'}}"
            class="w-24 h-24 object-contain mb-2 rounded-md"
            onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/1/14/No_Image_Available.jpg?20200913095930';">
        <div class="flex flex-col items-center justify-center grid grid-rows-2">
            <span class="font-medium text-sm text-center mb-1">{{item.name}}</span>
            <span class="font-bold text-md text-center text-[#FE4A60] mb-2">₩{{item.price}}</span>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
