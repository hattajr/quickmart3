</head>

<style>
    .outer-box {
        position: relative;
        z-index: 1000;
        border: var(--border-stroke-large);
        border-radius: var(--border-radius-large);
        box-shadow: var(--box-shadow-large);
        padding: 1rem;
    }
    .search-wrapper {
        position: relative;
        display: flex;
        gap: 1rem;
    }

    .search-container {
        flex: 1;
        position: relative;
    }

    .search-input {
        width: 100%;
        font-size: 1.7rem;
        padding: 1rem;
        background: var(--color-bg-secondary);
        border: var(--border-stroke-large);
        border-radius: var(--border-radius-medium);
        box-shadow: var(--box-shadow-medium);

    }

    .search-camera {
        width: 5rem;
        border: var(--border-stroke-large);
        background: var(--color-bg-secondary);
        box-shadow: var(--box-shadow-medium) ;
        border-radius: var(--border-radius-medium);
        cursor: pointer

    }


    .search-result-container {
        width: 100%;
        position: absolute;
        left: 0;
        top: 120%;
        background: var(--color-bg-secondary);
        border: var(--border-stroke-large);
        border-radius: var(--border-radius-large);
        box-shadow: var(--box-shadow-large);

        max-height: 50vh;
        overflow-y: auto;
        display: none;
        margin: .5rem 0;
    }


    .search-result-item {
        align-items: center;
        font-size: 1.5rem;
        gap: 10px;
        padding: 5px;
        cursor: pointer;
        display: flex;
        border-radius: 0;
    }
    .search-result-item img {
        width: 50px;
        aspect-ratio: 3 / 4;
        object-fit: cover;

    }
    .search-result-item:hover {
        background: white;
        outline: 2px solid black;
        outline-offset: 0;
    }

    .favorite-items {
        display: flex;
        flex-wrap: wrap;
        gap: .5rem;
        margin-top: 1rem;
    }

    .favorite-item {
            padding: .5rem 1rem;
            background: var(--color-bg-secondary);
            border: var(--border-stroke-medium);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: .5rem;
        }

    .cart-container {
        border: var(--border-stroke-large);
        box-shadow: var(--box-shadow-large);
        border-radius: var(--border-radius-large);
        background: var(--color-bg-white);
        height: 70vh;
        overflow-y: auto;
        margin-top: 2rem;
        overflow-y: auto;
    }

    .cart-item {
        display: flex;
        margin: .5rem;
        margin-bottom: 1rem;
        border: var(--border-stroke-large);
        box-shadow: var(--box-shadow-medium);
        border-radius: var(--border-radius-medium);
        font-size: 1.5rem;
        height: 10rem;

    }
    .cart-item img {
        width: 8rem;
        aspect-ratio: 3 / 4;
        object-fit:cover;
        margin-right: 1rem;
    }

    .cart-item h1 {
        font-size: 1.5rem;
    }

    .cart-item h2 {
        font-size: 1rem;
    }

    .cart-item-details {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 1rem;

    }

    .checkout-container {
        margin-top: 2rem;
        border: var(--border-stroke-large);
        box-shadow: var(--box-shadow-large);
        border-radius: var(--border-radius-large);
        background: var(--color-bg-secondary);
        height: 15em;
    }


</style>

<body>
    <header></header>

    <div class="main_content">
        {% block main_content %}{% endblock %}
    </div>

    <footer>
    </footer>

</body>

</html>
